<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="50" font-size="28" font-family="Arial" font-weight="bold" fill="#0f172a">Swahili Translation Samples (1-4)</text>
<text x="40" y="95" font-size="20" font-family="Arial" font-weight="bold" fill="#1e293b">Example 1</text>
<text x="60" y="123" font-size="16" font-family="Arial" fill="#111827">EN: The diagram shows a plant cell. Calculate its length.</text>
<text x="60" y="145" font-size="16" font-family="Arial" fill="#b45309">MT SW: Mchoro inaonyesha seli ya mmea. Hesabu urefu wake.</text>
<text x="60" y="167" font-size="16" font-family="Arial" fill="#166534">Refined SW: Mchoro unaonyesha seli ya mmea. Kokotoa urefu wake.</text>
<text x="40" y="201" font-size="20" font-family="Arial" font-weight="bold" fill="#1e293b">Example 2</text>
<text x="60" y="229" font-size="16" font-family="Arial" fill="#111827">EN: In this experiment, temperature is the independent variable.</text>
<text x="60" y="251" font-size="16" font-family="Arial" fill="#b45309">MT SW: Katika hii jaribio, joto ni tofauti huru.</text>
<text x="60" y="273" font-size="16" font-family="Arial" fill="#166534">Refined SW: Katika jaribio hili, halijoto ndiyo kigezo huru.</text>
<text x="40" y="307" font-size="20" font-family="Arial" font-weight="bold" fill="#1e293b">Example 3</text>
<text x="60" y="335" font-size="16" font-family="Arial" fill="#111827">EN: Bacteria grow faster in warm conditions.</text>
<text x="60" y="357" font-size="16" font-family="Arial" fill="#b45309">MT SW: Bakteria zinakua haraka kwa hali ya joto.</text>
<text x="60" y="379" font-size="16" font-family="Arial" fill="#166534">Refined SW: Bakteria hukua kwa kasi zaidi katika mazingira ya joto.</text>
<text x="40" y="413" font-size="20" font-family="Arial" font-weight="bold" fill="#1e293b">Example 4</text>
<text x="60" y="441" font-size="16" font-family="Arial" fill="#111827">EN: Find the average speed of the moving object.</text>
<text x="60" y="463" font-size="16" font-family="Arial" fill="#b45309">MT SW: Tafuta kasi ya kiasi cha wastani ya kitu kinachosonga.</text>
<text x="60" y="485" font-size="16" font-family="Arial" fill="#166534">Refined SW: Tafuta wastani wa kasi ya kitu kinachosogea.</text>
</svg>